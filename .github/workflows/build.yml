name: Build Windows EXE

# 触发时机：
#   1. 推 v* 标签（例如 v1.2.0）—— 自动编译并把 exe 挂到 Release 附件里
#   2. 对 master 的 push —— 只做「打包 + 自检 + 上传 Artifact」的冒烟测试，不发 Release
#   3. 手动触发（Actions 页面点 Run workflow）—— 同 2
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

# 同一分支/tag 只跑一个，新推送取消旧的
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # 发 Release 需要写权限

env:
  # 统一 UTF-8，避免 Windows 上的 bash 把中文路径/日志搞乱
  # （产物名已全改 ASCII，但 README、提交说明里还有中文）
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    name: 编译 Windows exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 必须拿全历史：更新日志是 changelog.py 从 git log 里生成的，
          # 默认的 fetch-depth: 1 只拿到一个提交，也看不到历史 tag，
          # 结果会是「本次没有需要记录的改动」。
          fetch-depth: 0
          # 还要显式取 tag —— changelog.py 靠 git describe 找上一个版本，
          # 少了 tag 就会退化成「列出全部提交」，每个版本都刷一遍旧日志。
          fetch-tags: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VER="$(python -c "import version; print(version.VERSION)")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本号: $VER"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 必须装齐：requirements.txt 里那几个（fh_tool-cli、pyserial）虽然
          # 在源码里是「可选依赖」，但**打包**时不能省 —— 少了它们，
          # PyInstaller 就找不到对应模块，产物里就没有烽火支持和 TTL 支持。
          # 自检对缺失只打 [!] 警告、不算失败，所以这个坑不会自己暴露
          # （实测踩过：CI 的 exe 比本地小 4.5MB，烽火功能是坏的）。
          python -m pip install telnetlib3 pyinstaller -r requirements.txt

      - name: 语法检查
        run: python -m py_compile flash.py gui.py config.py version.py changelog.py package_release.py uboot_release.py

      - name: 打包 exe
        run: python -m PyInstaller --clean --noconfirm build_exe.spec

      - name: 检查产物
        shell: bash
        run: |
          set -e
          # 用通配符拿文件名，而不是把中文名写死在脚本里 ——
          # 免得 shell 的编码差异把路径搞坏
          EXE="$(ls dist/*.exe | head -1)"
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::没有生成 exe"
            ls -la dist/ || true
            exit 1
          fi
          SIZE="$(wc -c < "$EXE" | tr -d ' ')"
          echo "产物: $EXE"
          echo "大小: $SIZE 字节"
          # 太小说明 PyInstaller 没把东西打进去。带 fh_tool_cli + pyserial
          # 后正常是 19~21MB；低于 18MB 基本就是漏装了 requirements.txt
          # （踩过：只装 telnetlib3+pyinstaller 时产物 15.9MB，烽火功能是坏的）。
          if [ "$SIZE" -lt 18000000 ]; then
            echo "::error::exe 只有 $SIZE 字节，明显不完整"
            exit 1
          fi

      - name: 自检（确认依赖齐全）
        shell: bash
        run: |
          cd dist
          rm -f selftest.log
          # exe 是 GUI 子系统程序，从 shell 调用时不一定等它结束，
          # 所以不能只看退出码 —— 轮询等 selftest.log 出现。
          # --quiet 让它失败时也不弹窗（弹窗会在无人值守的 CI 上挂住流程）。
          ./xe-pon-flash-toolkit*.exe --selftest --quiet || true
          for i in $(seq 1 30); do
            [ -s selftest.log ] && break
            sleep 1
          done

          echo "----- selftest.log -----"
          if [ ! -s selftest.log ]; then
            echo "::error::exe 没有生成 selftest.log，说明它根本没跑起来"
            ls -la
            exit 1
          fi
          cat selftest.log
          echo "------------------------"

          if ! grep -q "自检通过" selftest.log; then
            echo "::error::exe 自检未通过（多半是漏了 hiddenimports 或 requirements.txt）"
            exit 1
          fi
          # 自检对「打包后仍缺可选依赖」会打 [✗]，这里再兜一道，
          # 防止将来又悄悄发出一个功能残缺的包。
          if grep -q "\[✗\]" selftest.log; then
            echo "::error::自检里有 [✗] 项，产物不完整"
            exit 1
          fi
          grep -q "v${{ steps.ver.outputs.version }}" selftest.log \
            || echo "::warning::selftest.log 里没看到版本号 ${{ steps.ver.outputs.version }}"

      - name: 下载上游 U-Boot 合集（修改版 / 官方版 / loong1996）
        env:
          # 查 api.github.com 要 token：匿名 60 次/小时，这一步要查三个仓库加
          # 十几个 asset，很容易被限流。下载 asset 本身不带 token
          # （会 302 到 objects.githubusercontent.com，跟过去等于把 token
          # 送给别的域名）。
          GITHUB_TOKEN: ${{ github.token }}
        run: python uboot_release.py uboot-bin

      - name: 打包 zip（exe + tcboot.bin + an758x-stock2ubi + uboot-bin）并准备 Release 附件
        env:
          # 带 token 查 GitHub API：匿名只有 60 次/小时，Actions 跑一轮就
          # 可能被 403 rate limit 挡掉（本地实测踩过）。CI 里是 5000 次/小时。
          # 这个 token 只用于 api.github.com 查 latest release，
          # 下载 asset 时不带（会 302 到 objects.githubusercontent.com，
          # 跟过去等于把 token 送给别的域名）。
          GITHUB_TOKEN: ${{ github.token }}
        run: python package_release.py dist

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact 名用 ASCII，避免各平台解压工具对非 ASCII 名的兼容问题
          name: xe-pon-flash-toolkit-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/release/SHA256SUMS.txt
            dist/selftest.log
          if-no-files-found: error

      # 只有推 tag 才发 Release；分支 push 和手动触发都跳过
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VER="${{ steps.ver.outputs.version }}"

          # 校验 tag 与 version.py 一致，防止打了 tag 忘了改版本号
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag 是 $TAG，但 version.py 里是 v$VER —— 请用 ./release.sh 发版"
            exit 1
          fi

          cat > _release_notes.md <<EOF
          ## 邪恶的光猫刷机工具箱 $TAG

          Windows 单文件 exe，下载后直接双击运行，无需安装 Python。

          - 推荐下载：\`xe-pon-flash-toolkit-v${VER}.zip\`（已含 exe、tcboot.bin、an758x-stock2ubi，
            以及 \`uboot-bin/\` 里的 U-Boot 合集：修改版 / 官方版 / loong1996，解压即用）
          - 只要 exe：\`xe-pon-flash-toolkit-v${VER}.exe\`（tcboot.bin 已内置，开箱即用；不含 \`uboot-bin/\`）
          - **HG5585F / HG5382A（华邦闪存）**：先刷 \`uboot-bin/修改版/\` 里的临时引导，
            进系统后立刻换刷 \`uboot-bin/官方版/\` 里的官方引导 —— 先临时后官方，
            能最大限度避免「刷完进不去系统、只能 TTL 救砖」
          - 校验：见附件 \`SHA256SUMS.txt\`（在解压出来的目录里执行 \`sha256sum -c SHA256SUMS.txt\`）
          - 用法：先把光猫恢复出厂设置（按住 reset 20 秒以上），
            再把铭牌上的账号密码填进界面，按步骤操作即可
          - 详细说明见 [README](https://github.com/${{ github.repository }}#readme)
          - 许可：**AGPL-3.0-only**。老版本用的是 WTFPL v2，本版本起换成 AGPL-3.0。
            自己刷机、自己改着玩都不受影响；改了之后再对外发布，请一并提供源码

          > 刷机有风险，请先完整备份。默认模式只开 Telnet / FTP 和备份，不会写入任何分区。
          EOF

          # 把自动生成的更新日志接在后面。
          # 生成失败（例如浅克隆看不到历史）不该让发版挂掉 —— 那样反而发不出去，
          # 所以失败就只警告一句，说明文字少一段而已。
          if python changelog.py "$TAG" > _changelog.md 2>_changelog.err; then
            printf '\n---\n\n' >> _release_notes.md
            cat _changelog.md >> _release_notes.md
            echo "----- 更新日志 -----"
            cat _changelog.md
            echo "--------------------"
          else
            echo "::warning::更新日志生成失败，Release 说明里将不含更新日志"
            sed 's/^/    /' _changelog.err || true
          fi

          # SHA256SUMS.txt 由 package_release.py 生成 —— 它算的是
          # dist/release/ 里那份**ASCII 名**副本的哈希，正好就是上传到
          # Release 之后的附件名。所以这里不能自己再 sha256sum 一遍
          # dist/*.exe（那份不带版本号），否则用户校验时会找不到文件。
          cat dist/release/SHA256SUMS.txt

          # 先试创建；已存在（例如重跑同一个 tag、或修复旧 Release）就改成
          # 「改说明 + 覆盖附件」，这样重跑 CI 就能把旧 Release 修好。
          # 注意 gh release upload 不会更新说明文字，必须单独 edit。
          # 传的是 dist/release/ 下带版本号的副本，不是 dist 里的构建产物 ——
          # GitHub 会把附件名里的非 ASCII 字符直接删掉，与其让它隐式改名，
          # 不如我们自己定名。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "邪恶的光猫刷机工具箱 $TAG" \
              --notes-file _release_notes.md
            gh release upload "$TAG" \
              dist/release/xe-pon-flash-toolkit-v$VER.zip dist/release/xe-pon-flash-toolkit-v$VER.exe dist/release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              --title "邪恶的光猫刷机工具箱 $TAG" \
              --notes-file _release_notes.md \
              dist/release/xe-pon-flash-toolkit-v$VER.zip dist/release/xe-pon-flash-toolkit-v$VER.exe dist/release/SHA256SUMS.txt
          fi

          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
